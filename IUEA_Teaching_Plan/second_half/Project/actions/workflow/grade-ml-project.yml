# Instant checks for the Engineering ML project. Goes in the PRIVATE grading repository as .github/workflows/grade-ml-project.yml.
# Started by the collector (repository_dispatch, event type grade-ml-project) once per accepted submission, or by hand (Run workflow).
# Secrets (repository settings, Secrets and variables, Actions): COLLECTOR_URL (the collector web app /exec URL), COLLECTOR_SECRET.
name: Grade ML project submission
on:
  repository_dispatch:
    types: [grade-ml-project]
  workflow_dispatch:
    inputs:
      submission_id:
        description: Receipt code (S-...)
        required: true
permissions:
  contents: read
concurrency:
  group: grade-${{ github.event.client_payload.submission_id || inputs.submission_id }}
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SUBMISSION_ID: ${{ github.event.client_payload.submission_id || inputs.submission_id }}
      PROJECT: IUEA_Teaching_Plan/second_half/Project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: IUEA_Teaching_Plan/second_half/Project/actions/requirements-host.txt
      - run: pip install -r "$PROJECT/actions/requirements-host.txt"
      - uses: docker/setup-buildx-action@v3
      - name: Build the Colab-matching sandbox (cached between runs)
        uses: docker/build-push-action@v6
        with:
          context: IUEA_Teaching_Plan/second_half/Project/sandbox
          tags: iuea-notebooks:colab-2026.11
          load: true
          push: false
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - name: Fetch, grade in the sandbox, post the result back
        env:
          COLLECTOR_URL: ${{ secrets.COLLECTOR_URL }}
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
        run: python "$PROJECT/actions/actions_grade.py" --submission-id "$SUBMISSION_ID"
